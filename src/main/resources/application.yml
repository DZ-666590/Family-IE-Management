server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: family-finance
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jackson:
    time-zone: UTC
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration-mysql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

app:
  seed:
    enabled: true

  ai:
    encryption-key: ${APP_AI_ENCRYPTION_KEY:}
    allowed-hosts: ${APP_AI_ALLOWED_HOSTS:}

# Never enable HTTP wire/header logging for credential-bearing AI requests.
logging:
  level:
    org.apache.hc.client5.http.wire: OFF
    org.apache.hc.client5.http.headers: OFF
