server:
  address: 0.0.0.0
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  ai:
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY}
      chat:
        options:
          model: glm-4-plus # 推荐使用 GLM-4 增强版，适合复杂的推理和信息提取
          temperature: 0.2  # 提取合同信息需要高精准度，建议将温度调低
  application:
    name: family-finance
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jackson:
    time-zone: UTC
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration-mysql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  seed:
    enabled: true
  plugins:
    loan-contract-extractor:
      enabled: true
